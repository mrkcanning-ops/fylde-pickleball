<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <!-- Paddle frame - curved top -->
  <path d="M 80 180 Q 80 80 150 40 Q 220 80 220 180 L 210 200 Q 210 120 150 70 Q 90 120 90 200 Z" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ball - Red circle with white dots -->
  <circle cx="150" cy="120" r="60" fill="#DC143C"/>
  <circle cx="130" cy="100" r="8" fill="#FFF"/>
  <circle cx="170" cy="100" r="8" fill="#FFF"/>
  <circle cx="120" cy="140" r="8" fill="#FFF"/>
  <circle cx="180" cy="140" r="8" fill="#FFF"/>
  <circle cx="150" cy="110" r="8" fill="#FFF"/>
  
  <!-- Paddle handle - thick grip -->
  <rect x="125" y="210" width="50" height="80" fill="#000" rx="10"/>
  <line x1="130" y1="220" x2="130" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="140" y1="220" x2="140" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="220" x2="150" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="160" y1="220" x2="160" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="170" y1="220" x2="170" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- FCP Text - Black bold -->
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#000">FCP</text>
  
  <!-- Fylde Coast Pickleball - Red text -->
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#DC143C">Fylde Coast Pickleball</text>
</svg>
