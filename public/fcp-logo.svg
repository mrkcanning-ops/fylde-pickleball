<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Paddle head - curved arch -->
  <path d="M 80 140 Q 80 60 160 40 Q 240 60 240 140" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Connect bottom of paddle -->
  <line x1="80" y1="140" x2="240" y2="140" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Red Pickleball in center -->
  <circle cx="160" cy="100" r="50" fill="#E31E24"/>
  
  <!-- White dots on ball -->
  <circle cx="140" cy="80" r="7" fill="#FFF"/>
  <circle cx="180" cy="80" r="7" fill="#FFF"/>
  <circle cx="130" cy="110" r="7" fill="#FFF"/>
  <circle cx="190" cy="110" r="7" fill="#FFF"/>
  <circle cx="160" cy="130" r="7" fill="#FFF"/>
  <circle cx="145" cy="95" r="5" fill="#FFF"/>
  
  <!-- Paddle handle - left side -->
  <rect x="85" y="150" width="35" height="120" fill="#000" rx="6"/>
  
  <!-- Handle grip lines -->
  <line x1="90" y1="165" x2="115" y2="165" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="180" x2="115" y2="180" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="195" x2="115" y2="195" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="210" x2="115" y2="210" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="225" x2="115" y2="225" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="240" x2="115" y2="240" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- FCP Text - Large black -->
  <text x="180" y="220" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="#000" letter-spacing="8">FCP</text>
  
  <!-- Fylde Coast Pickleball - Red italic text -->
  <text x="185" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" font-weight="bold" fill="#E31E24" letter-spacing="1">Fylde Coast</text>
  <text x="185" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" font-weight="bold" fill="#E31E24" letter-spacing="1">Pickleball</text>
</svg>
